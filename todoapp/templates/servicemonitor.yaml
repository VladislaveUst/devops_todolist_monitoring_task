apiVersion: v1
kind: Service
metadata:
  name: todoapp-service
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    app: todoapp
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
# 2. Створюємо ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todoapp-monitor
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: todoapp
      app.kubernetes.io/instance: todoapp
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics